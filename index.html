
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Delivery Route</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#172033;font-family:Arial,sans-serif}
header{background:#087f5b;color:white;text-align:center;padding:18px 10px}
main{max-width:650px;margin:auto;padding:12px}
.card{background:white;border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:19px;margin-top:0}
input{width:100%;padding:13px;margin:7px 0;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
button{width:100%;padding:13px;margin:5px 0;border:0;border-radius:8px;background:#087f5b;color:white;font-size:16px;font-weight:bold}
.blue{background:#2563eb}
.red{background:#dc2626}
.store{border:1px solid #ddd;border-radius:9px;padding:12px;margin:10px 0;overflow-wrap:anywhere}
a{color:#2563eb}
small{color:#64748b}
</style>
</head>
<body>
<header>
<h1>My Delivery Route</h1>
<p>আপনার ডেলিভারি সহজ করুন</p>
</header>
<main>

<section class="card">
<h2>📍 বর্তমান লোকেশন</h2>
<p id="status">লোকেশন চালু করতে নিচের বাটনে চাপ দিন।</p>
<button onclick="getLocation()">আমার লোকেশন চালু করুন</button>
</section>

<section class="card">
<h2>🏪 নতুন দোকান যোগ করুন</h2>
<input id="shopName" placeholder="দোকানের নাম লিখুন">
<input id="shopLink" placeholder="Google Maps লিংক পেস্ট করুন">
<button onclick="addStore()">দোকান যোগ করুন</button>
<small>Google Maps থেকে দোকানের Share → Copy link ব্যবহার করুন।</small>
</section>

<section class="card">
<h2>🗺️ ডেলিভারি রুট</h2>
<p id="summary">মোট দোকান: ০</p>
<button onclick="startJourney()">যাত্রা শুরু</button>
<button class="blue" onclick="openStoreLocations()">দোকানের লোকেশন দেখুন</button>
</section>

<section class="card">
<h2>📋 দোকানের তালিকা</h2>
<div id="stores"></div>
</section>

</main>

<script>
let shops=[];
let currentPosition=null;

try{
shops=JSON.parse(localStorage.getItem("deliveryShops")||"[]");
if(!Array.isArray(shops)) shops=[];
}catch(e){shops=[];}

function saveShops(){
try{
localStorage.setItem("deliveryShops",JSON.stringify(shops));
render();
}catch(e){
alert("দোকান সেভ করা যায়নি। ব্রাউজারের স্টোরেজ পরীক্ষা করুন।");
}
}

function getLocation(callback){
const status=document.getElementById("status");

if(!navigator.geolocation){
status.textContent="আপনার ব্রাউজারে GPS সুবিধা নেই।";
return;
}

if(!window.isSecureContext){
status.textContent="অ্যাপটি HTTPS লিংক দিয়ে খুলুন।";
return;
}

status.textContent="আপনার লোকেশন খোঁজা হচ্ছে...";

navigator.geolocation.getCurrentPosition(
function(pos){
currentPosition={
lat:pos.coords.latitude,
lng:pos.coords.longitude
};
status.textContent="লোকেশন চালু হয়েছে!\n"+
currentPosition.lat+", "+currentPosition.lng;
if(callback) callback();
},
function(err){
const messages={
1:"লোকেশনের অনুমতি দিন।",
2:"ফোনের GPS/Location চালু করে আবার চেষ্টা করুন।",
3:"সময় শেষ হয়েছে। আবার চেষ্টা করুন।"
};
status.textContent=messages[err.code]||"লোকেশন পাওয়া যায়নি।";
},
{enableHighAccuracy:true,timeout:20000,maximumAge:0}
);
}

function addStore(){
const name=document.getElementById("shopName").value.trim();
const link=document.getElementById("shopLink").value.trim();

if(!name){
alert("দোকানের নাম লিখুন।");
return;
}

if(!/^https?:\/\//i.test(link)){
alert("সঠিক Google Maps লিংক পেস্ট করুন।");
return;
}

shops.push({
id:Date.now().toString()+Math.random().toString(16).slice(2),
name:name,
link:link,
done:false
});

saveShops();
document.getElementById("shopName").value="";
document.getElementById("shopLink").value="";
alert("দোকান সফলভাবে যোগ হয়েছে!");
}

function render(){
const box=document.getElementById("stores");
box.replaceChildren();

document.getElementById("summary").textContent=
"মোট দোকান: "+shops.length+
" | বাকি ডেলিভারি: "+shops.filter(s=>!s.done).length;

if(shops.length===0){
box.textContent="এখনও কোনো দোকান যোগ করা হয়নি।";
return;
}

shops.forEach(function(shop){
const card=document.createElement("div");
card.className="store";

const name=document.createElement("strong");
name.textContent=(shop.done?"✅ ":"🏪 ")+shop.name;
card.appendChild(name);

const link=document.createElement("a");
link.href=shop.link;
link.target="_blank";
link.rel="noopener";
link.textContent="দোকানের লোকেশন খুলুন";
link.style.display="block";
link.style.margin="10px 0";
card.appendChild(link);

const done=document.createElement("button");
done.textContent=shop.done?"ডেলিভারি সম্পন্ন হয়েছে":"ডেলিভারি সম্পন্ন করুন";
done.disabled=shop.done;
done.onclick=function(){
shop.done=true;
saveShops();
};
card.appendChild(done);

const remove=document.createElement("button");
remove.className="red";
remove.textContent="দোকান মুছে ফেলুন";
remove.onclick=function(){
if(confirm("এই দোকানটি মুছে ফেলবেন?")){
shops=shops.filter(s=>s.id!==shop.id);
saveShops();
}
};
card.appendChild(remove);
box.appendChild(card);
});
}

function getDestination(link){
try{
const u=new URL(link);
const q=u.searchParams.get("query")||
u.searchParams.get("q")||
u.searchParams.get("destination");

if(q) return q;

const path=u.pathname.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
if(path) return path[1]+","+path[2];

const coord=decodeURIComponent(link).match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);
if(coord) return coord[1]+","+coord[2];
}catch(e){}

const coord=link.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
if(coord) return coord[1]+","+coord[2];

return null;
}

function startJourney(){
const pending=shops.filter(s=>!s.done);

if(pending.length===0){
alert("আগে একটি দোকান যোগ করুন।");
return;
}

getLocation(function(){
const destinations=pending.map(s=>getDestination(s.link));

if(destinations.some(d=>!d)){
alert("একটি বা একাধিক দোকানের লিংক থেকে ঠিকানা পাওয়া যায়নি। দোকানের পূর্ণ ঠিকানা বা স্থানাঙ্ক ব্যবহার করুন।");
return;
}

const origin=currentPosition.lat+","+currentPosition.lng;
const destination=destinations[destinations.length-1];
const waypoints=destinations.slice(0,-1);

let url="https://www.google.com/maps/dir/?api=1";
url+="&origin="+encodeURIComponent(origin);
url+="&destination="+encodeURIComponent(destination);
url+="&travelmode=driving";

if(waypoints.length){
url+="&waypoints="+encodeURIComponent(waypoints.join("|"));
}

window.location.href=url;
});
}

function openStoreLocations(){
if(shops.length===0){
alert("আগে একটি দোকান যোগ করুন।");
return;
}
window.open(shops[0].link,"_blank");
}

render();
</script>
</body>
</html>
