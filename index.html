
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Delivery Route</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#172033}
header{background:#087f5b;color:white;text-align:center;padding:18px 10px}
main{max-width:650px;margin:auto;padding:12px}
.card{background:white;padding:16px;margin-bottom:14px;border-radius:12px}
h2{font-size:19px;margin-top:0}
input{width:100%;padding:13px;margin:7px 0;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
button{width:100%;padding:13px;margin:5px 0;border:0;border-radius:8px;background:#087f5b;color:white;font-size:16px;font-weight:bold}
.blue{background:#2563eb}
.red{background:#dc2626}
.store{padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:9px;overflow-wrap:anywhere}
a{color:#2563eb}
small{color:#64748b}
</style>
</head>
<body>
<header>
<h1>My Delivery Route</h1>
<p>সহজ ডেলিভারি রুট অ্যাপ</p>
</header>
<main>
<section class="card">
<h2>📍 বর্তমান লোকেশন</h2>
<p id="status">লোকেশন চালু করুন।</p>
<button onclick="getLocation()">আমার লোকেশন চালু করুন</button>
</section>

<section class="card">
<h2>🏪 নতুন দোকান যোগ করুন</h2>
<input id="shopName" placeholder="দোকানের নাম">
<input id="shopLink" placeholder="Google Maps লিংক অথবা ঠিকানা">
<button onclick="addStore()">দোকান যোগ করুন</button>
<small>Google Maps Share থেকে Copy link করুন। সম্ভব হলে পূর্ণ ঠিকানা বা স্থানাঙ্ক দিন।</small>
</section>

<section class="card">
<h2>🗺️ ডেলিভারি রুট</h2>
<p id="summary">মোট দোকান: ০</p>
<button onclick="startJourney()">যাত্রা শুরু</button>
<button class="blue" onclick="openFirstShop()">প্রথম দোকানের লোকেশন খুলুন</button>
</section>

<section class="card">
<h2>📋 দোকানের তালিকা</h2>
<div id="stores"></div>
</section>
</main>

<script>
let shops=[];
let currentPosition=null;

try{
shops=JSON.parse(localStorage.getItem("deliveryShopsV2")||"[]");
if(!Array.isArray(shops)) shops=[];
}catch(e){shops=[];}

function save(){
try{
localStorage.setItem("deliveryShopsV2",JSON.stringify(shops));
render();
}catch(e){alert("দোকান সংরক্ষণ করা যায়নি।");}
}

function getLocation(callback){
const status=document.getElementById("status");

if(!navigator.geolocation){
status.textContent="এই ব্রাউজারে লোকেশন সুবিধা নেই।";
return;
}
if(!window.isSecureContext){
status.textContent="HTTPS লিংক দিয়ে অ্যাপটি খুলুন।";
return;
}

status.textContent="লোকেশন খোঁজা হচ্ছে...";

navigator.geolocation.getCurrentPosition(function(p){
currentPosition={lat:p.coords.latitude,lng:p.coords.longitude};
status.textContent="লোকেশন পাওয়া গেছে!\n"+
currentPosition.lat+", "+currentPosition.lng;
if(callback) callback();
},function(e){
status.textContent=e.code===1?
"Chrome-এ এই সাইটের Location অনুমতি Allow করুন।":
e.code===2?"ফোনের GPS/Location চালু করে আবার চেষ্টা করুন।":
"লোকেশন পেতে সময় শেষ হয়েছে। আবার চেষ্টা করুন।";
},{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}

function addStore(){
const name=document.getElementById("shopName").value.trim();
const link=document.getElementById("shopLink").value.trim();

if(!name||!link){
alert("দোকানের নাম ও Google Maps লিংক বা ঠিকানা লিখুন।");
return;
}

if(/^https?:\/\//i.test(link)===false &&
!/-?\d{1,3}\.\d+,\s*-?\d{1,3}\.\d+/.test(link)){
// সাধারণ ঠিকানাও গ্রহণ করা হবে
}

shops.push({id:Date.now()+Math.random(),name:name,link:link,done:false});
save();
document.getElementById("shopName").value="";
document.getElementById("shopLink").value="";
alert("দোকান যোগ হয়েছে!");
}

function render(){
const box=document.getElementById("stores");
box.replaceChildren();
document.getElementById("summary").textContent=
"মোট দোকান: "+shops.length+" | বাকি: "+shops.filter(s=>!s.done).length;

if(!shops.length){
box.textContent="এখনও কোনো দোকান যোগ করা হয়নি।";
return;
}

shops.forEach(s=>{
const div=document.createElement("div");
div.className="store";

const title=document.createElement("strong");
title.textContent=(s.done?"✅ ":"🏪 ")+s.name;
div.appendChild(title);

const a=document.createElement("a");
a.href=shopURL(s.link);
a.target="_blank";
a.rel="noopener";
a.textContent="দোকানের লোকেশন খুলুন";
a.style.display="block";
a.style.margin="10px 0";
div.appendChild(a);

const done=document.createElement("button");
done.textContent=s.done?"ডেলিভারি সম্পন্ন হয়েছে":"ডেলিভারি সম্পন্ন করুন";
done.disabled=s.done;
done.onclick=()=>{s.done=true;save();};
div.appendChild(done);

const del=document.createElement("button");
del.className="red";
del.textContent="দোকান মুছে ফেলুন";
del.onclick=()=>{
if(confirm("এই দোকানটি মুছে ফেলবেন?")){
shops=shops.filter(x=>x.id!==s.id);save();
}
};
div.appendChild(del);
box.appendChild(div);
});
}

function shopURL(value){
if(/^https?:\/\//i.test(value)) return value;
return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(value);
}

function destination(value){
const coord=value.match(/(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
if(coord) return coord[1]+","+coord[2];

try{
const u=new URL(value);
const q=u.searchParams.get("query")||u.searchParams.get("q")||
u.searchParams.get("destination");
if(q) return q;

const at=decodeURIComponent(value).match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
if(at) return at[1]+","+at[2];

const place=decodeURIComponent(value).match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);
if(place) return place[1]+","+place[2];
}catch(e){}

if(!/^https?:\/\//i.test(value)) return value;
return null;
}

function openFirstShop(){
if(!shops.length){alert("আগে দোকান যোগ করুন।");return;}
window.open(shopURL(shops[0].link),"_blank");
}

function startJourney(){
const pending=shops.filter(s=>!s.done);
if(!pending.length){alert("আগে একটি দোকান যোগ করুন।");return;}

getLocation(function(){
const dests=pending.map(s=>destination(s.link));

if(dests.some(d=>!d)){
alert("Google Maps-এর ছোট লিংক থেকে ঠিকানা সরাসরি পড়া যাচ্ছে না। প্রথমে দোকানের লোকেশন খুলে পূর্ণ ঠিকানা বা স্থানাঙ্ক কপি করে ব্যবহার করুন।");
window.open(shopURL(pending[0].link),"_blank");
return;
}

const origin=currentPosition.lat+","+currentPosition.lng;
let url="https://www.google.com/maps/dir/?api=1"+
"&origin="+encodeURIComponent(origin)+
"&destination="+encodeURIComponent(dests[dests.length-1])+
"&travelmode=driving";

if(dests.length>1){
url+="&waypoints="+encodeURIComponent(dests.slice(0,-1).join("|"));
}

window.location.href=url;
});
}

render();
</script>
</body>
</html>
