
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Delivery Route</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:18px;background:#f4f6f8;color:#222}
h2{text-align:center;color:#1769aa}
.box{background:white;padding:16px;border-radius:12px;margin-bottom:14px}
input{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border:1px solid #bbb;border-radius:7px;font-size:16px}
button{padding:12px;border:0;border-radius:7px;background:#1769aa;color:white;font-size:15px;cursor:pointer;margin:4px 0}
.full{width:100%}
.store{background:white;padding:13px;border-radius:9px;margin:10px 0;border:1px solid #ddd;overflow-wrap:anywhere}
.store button{margin-right:4px}
.done{background:#e1f5e7}
.small{font-size:13px;color:#555}
</style>
</head>
<body>
<h2>My Delivery Route</h2>

<div class="box">
<h3>নতুন দোকান যোগ করুন</h3>
<input id="shopName" placeholder="দোকানের নাম লিখুন">
<input id="shopLink" placeholder="Google Maps লিংক পেস্ট করুন">
<button class="full" onclick="addStore()">নতুন দোকান যোগ করুন</button>
<p class="small">Google Maps থেকে Share → Copy link করে লিংকটি এখানে দিন।</p>
</div>

<div class="box">
<h3>ডেলিভারি রুট</h3>
<button class="full" onclick="startRoute()">যাত্রা শুরু / রুট তৈরি করুন</button>
<button class="full" onclick="openAll()">দোকানগুলো Google Maps-এ খুলুন</button>
<p id="message"></p>
</div>

<div class="box">
<h3>দোকানের তালিকা</h3>
<div id="storeList"></div>
</div>

<script>
const KEY = "myDeliveryRouteStoresV2";
let stores = [];

try {
  stores = JSON.parse(localStorage.getItem(KEY) || "[]");
  if (!Array.isArray(stores)) stores = [];
} catch(e) {
  stores = [];
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(stores));
  render();
}

function addStore() {
  const name = document.getElementById("shopName").value.trim();
  const link = document.getElementById("shopLink").value.trim();

  if (!name || !link) {
    alert("দোকানের নাম এবং Google Maps লিংক দুটোই লিখুন।");
    return;
  }

  if (!/^https?:\/\//i.test(link)) {
    alert("সঠিক Google Maps লিংক পেস্ট করুন।");
    return;
  }

  stores.push({
    id: Date.now().toString() + Math.random().toString(16).slice(2),
    name, link, done: false
  });

  document.getElementById("shopName").value = "";
  document.getElementById("shopLink").value = "";
  save();
  document.getElementById("message").textContent = "দোকান সফলভাবে যোগ হয়েছে।";
}

function render() {
  const list = document.getElementById("storeList");
  list.innerHTML = "";

  if (!stores.length) {
    list.textContent = "এখনো কোনো দোকান যোগ করা হয়নি।";
    return;
  }

  stores.forEach((s, i) => {
    const card = document.createElement("div");
    card.className = "store" + (s.done ? " done" : "");

    const title = document.createElement("strong");
    title.textContent = (i + 1) + ". " + s.name +
      (s.done ? " — ডেলিভারি সম্পন্ন ✓" : "");

    const open = document.createElement("button");
    open.textContent = "Google Map খুলুন";
    open.onclick = () => window.open(s.link, "_blank", "noopener");

    const done = document.createElement("button");
    done.textContent = s.done ? "অসম্পন্ন করুন" : "ডেলিভারি সম্পন্ন";
    done.onclick = () => {
      s.done = !s.done;
      save();
    };

    const remove = document.createElement("button");
    remove.textContent = "মুছুন";
    remove.style.background = "#b3261e";
    remove.onclick = () => {
      if (confirm("এই দোকানটি মুছে ফেলবেন?")) {
        stores = stores.filter(x => x.id !== s.id);
        save();
      }
    };

    card.appendChild(title);
    card.appendChild(document.createElement("br"));
    card.appendChild(open);
    card.appendChild(done);
    card.appendChild(remove);
    list.appendChild(card);
  });
}

function getLocation(link) {
  try {
    const u = new URL(link);
    const text = u.searchParams.get("q") ||
                 u.searchParams.get("query") ||
                 u.searchParams.get("destination");

    if (text && !text.includes("goo.gl/")) return text;

    const place = u.pathname.match(/\/place\/([^/]+)/);
    if (place) return decodeURIComponent(place[1].replace(/\+/g, " "));

    const coords = link.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);
    if (coords) return coords[1] + "," + coords[2];

    const at = link.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
    if (at) return at[1] + "," + at[2];

    return null;
  } catch(e) {
    return null;
  }
}

function startRoute() {
  if (!stores.length) {
    alert("আগে অন্তত একটি দোকান যোগ করুন।");
    return;
  }

  const locations = stores.map(s => getLocation(s.link));

  if (locations.some(x => !x)) {
    alert("কোনো লিংক থেকে লোকেশন পড়া যায়নি। সেই দোকানের Google Maps-এ গিয়ে Share → Copy link করুন। তারপর আবার লিংক যোগ করুন।");
    return;
  }

  if (locations.length === 1) {
    window.open("https://www.google.com/maps/dir/?api=1&destination=" +
      encodeURIComponent(locations[0]) + "&travelmode=driving", "_blank");
    return;
  }

  const origin = locations[0];
  const destination = locations[locations.length - 1];
  const waypoints = locations.slice(1, -1).join("|");

  let url = "https://www.google.com/maps/dir/?api=1" +
    "&origin=" + encodeURIComponent(origin) +
    "&destination=" + encodeURIComponent(destination) +
    "&travelmode=driving";

  if (waypoints) url += "&waypoints=" + encodeURIComponent(waypoints);

  window.open(url, "_blank");
}

function openAll() {
  if (!stores.length) {
    alert("আগে দোকান যোগ করুন।");
    return;
  }
  startRoute();
}

render();
</script>
</body>
</html>
